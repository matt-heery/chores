name: Weekly WhatsApp Chores

on:
  schedule:
    # Sunday at 18:00 UTC (adjust if needed)
    - cron: "0 18 * * 0"
  workflow_dispatch: {}

jobs:
  send-chores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib twilio

      - name: Restore Google OAuth token
        run: |
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Create credentials.json
        run: |
          cat <<EOF > credentials.json
          {
            "installed": {
              "client_id": "${{ secrets.GOOGLE_CLIENT_ID }}",
              "client_secret": "${{ secrets.GOOGLE_CLIENT_SECRET }}",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "redirect_uris": ["http://localhost"]
            }
          }
          EOF

      - name: Run weekly chores bot
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WHATSAPP_FROM: ${{ secrets.WHATSAPP_FROM }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          python weekly_chores.py
