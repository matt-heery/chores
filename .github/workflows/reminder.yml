name: Weekly Reminder Chores

on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

jobs:
  send-chores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Run weekly chores bot
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WHATSAPP_FROM: ${{ secrets.WHATSAPP_FROM }}
          WA_JAMIE: ${{ secrets.WA_JAMIE }}
          WA_MATT: ${{ secrets.WA_MATT }}
          WA_NATHAN: ${{ secrets.WA_NATHAN }}
          WA_SEAN: ${{ secrets.WA_SEAN }}
          TODOIST_USER_MAP: ${{ secrets.TODOIST_USER_MAP }}
        run: |
          uv run python reminder.py
