[project]
name = "chores"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.187.0",
    "google-auth-oauthlib>=1.2.3",
    "twilio>=9.9.1",
]

[dependency-groups]
dev = [
    "prek>=0.2.27",
    "ruff>=0.14.11",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# Remove warnings
ignore = ["D203", "D213", "COM812"]


[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101"]

[tool.typos]

[tool.typos.files]
extend-exclude = []

[tool.typos.default]
binary = false
check-filename = true
check-file = true
unicode=true
locale = "en"
extend-ignore-re = []
extend-ignore-identifiers-re = []

[tool.typos.default.extend-words]
# <typo> = "<correction>"

[tool.typos.default.extend-identifiers]
# <typo> = "<correction>"